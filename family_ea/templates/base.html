<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Family EA{% endblock %}</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; color: #222; overflow-wrap: anywhere; }
  nav { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
  nav a.current { color: #222; text-decoration: none; font-weight: 600; }
  nav form { margin-left: auto; }
  nav input[type=search] { font: inherit; padding: .3rem .4rem; width: 9rem; max-width: 100%; box-sizing: border-box; }
  .admin { position: relative; }
  .admin summary { cursor: pointer; color: #555; }
  .admin div { position: absolute; left: 0; top: 100%; z-index: 1; min-width: 10rem; margin-top: .3rem; padding: .3rem 0;
               background: #fff; border: 1px solid #ddd; border-radius: .4rem; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
  .admin a { display: block; padding: .35rem 1rem; }
  h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; border-bottom: 1px solid #ddd; padding-bottom: .25rem; }
  h3 { font-size: .95rem; margin: 1rem 0 .25rem; color: #555; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .35rem 0; border-bottom: 1px solid #f0f0f0; }
  .meta { color: #777; font-size: .85rem; }
  .id { color: #aaa; font-size: .8rem; margin-right: .4rem; }
  .empty { color: #999; }
  .overdue .meta { color: #b33; }
  pre { background: #f6f6f6; padding: .6rem; overflow-x: auto; font-size: .8rem; }
  details summary { cursor: pointer; color: #555; font-size: .85rem; }
  .admin summary { font-size: inherit; }
  .status-done, .status-dropped, .status-cancelled { text-decoration: line-through; color: #888; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem; }
  button { font: inherit; padding: .4rem 1rem; margin-top: .5rem; }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .row input { font: inherit; padding: .3rem .4rem; min-width: 0; max-width: 100%; box-sizing: border-box; }
  .row button { margin-top: 0; }
  .error { color: #b33; }
  .ical { text-decoration: none; margin-left: .4rem; }
  h2.overdue { color: #b33; }
  .dated li { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); column-gap: .5rem; }
  .dated .empty { display: block; }
  .time { color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time.allday { color: #888; font-size: .85rem; }
  .mark { margin-right: .25rem; }
  .reminder, .reminder .time { color: #888; }
  .rows .meta { display: inline; margin-left: .25rem; }
  .today .meta { display: block; margin-left: 0; }
  .done li { color: #888; }
  .today .text { white-space: pre-line; }
  li.todo { position: relative; padding-right: 2.4rem; }
  .sortable li.todo { padding-right: 4.6rem; }
  .tools { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; }
  .grip { padding: 0 .6rem; color: #aaa; font-size: 1.1rem; letter-spacing: -.15em; cursor: grab; touch-action: none;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button.edit { margin: 0; padding: 0 .5rem; border: 0; background: none; color: #aaa; font-size: 1.1rem;
                line-height: 1; cursor: pointer; -webkit-appearance: none; appearance: none; }
  li.editing .tools, li.closed .tools { display: none; }
  .dragging { background: #f6f6f6; opacity: .7; }
  li.todo .mark { cursor: pointer; display: inline-block; padding: .3rem .35rem .3rem .15rem;
                        margin: -.3rem 0 -.3rem -.15rem; }
  .rows li.closed, .rows li.closed .meta, .rows li.closed .time { color: #999; }
  .rows li.closed .text { text-decoration: line-through; }
  textarea.editor { padding: .1rem .3rem; margin: 0; resize: none; overflow: hidden; line-height: inherit; }
  .dragging .grip { cursor: grabbing; }
  .files { display: flex; flex-wrap: wrap; gap: .4rem; margin: .3rem 0 .1rem; }
  .files img { display: block; height: 5.5rem; border-radius: .3rem; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: .4rem;
            margin: .3rem 0 1rem; }
  .photos img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .3rem; }
  .photos.index span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
                       margin-top: .15rem; font-size: .75rem; line-height: 1.25; color: #555; }
  .photos.index span a { text-decoration: none; }
  dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog.lightbox::backdrop { background: rgba(0, 0, 0, .85); }
  dialog.lightbox img { display: block; max-width: 96vw; max-height: 96vh; cursor: zoom-out; }
  .doc { overflow-x: auto; }
  .doc h1 { font-size: 1.15rem; margin: 1.5rem 0 .5rem; }
  .doc h3 { color: #222; }
  .doc ul { list-style: disc; padding-left: 1.3rem; margin: .3rem 0 .8rem; }
  .doc ol { padding-left: 1.3rem; margin: .3rem 0 .8rem; }
  .doc li { padding: .1rem 0; border: 0; }
  .doc p { margin: .4rem 0 .8rem; }
  .doc table { border-collapse: collapse; margin: .3rem 0 1rem; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: .25rem .8rem .25rem 0; border-bottom: 1px solid #f0f0f0; }
  .doc th { color: #555; font-weight: 600; }
  .chat li { border: 0; padding: .4rem 0; }
  .chat .bubble { display: inline-block; max-width: 85%; padding: .4rem .7rem; border-radius: .7rem; white-space: pre-line; }
  .chat li.me { text-align: right; }
  .chat li.me .bubble { background: #dcecff; text-align: left; }
  .chat li.bot .bubble { background: #f0f0f0; }
  .chat .meta { display: block; margin-left: 0; }
  .chat pre { margin: .2rem 0 0; }
  .chat li.me pre { margin-left: auto; max-width: 85%; text-align: left; }
  form.send { display: flex; gap: .5rem; align-items: flex-end; flex-wrap: wrap; margin-top: 1rem; }
  form.send textarea { flex: 1 1 14rem; min-height: 2.8rem; }
  form.send button { margin-top: 0; }
  form.send input[type=file] { font-size: .85rem; max-width: 12rem; }
</style>
</head>
<body>
{% set path = request.url.path %}
<nav>
  <a href="/"{% if path == '/' and not q %} class="current"{% endif %}>Задачі</a>
  <a href="/notes"{% if path.startswith('/notes') %} class="current"{% endif %}>Нотатки</a>
  <a href="/items"{% if path.startswith('/items') %} class="current"{% endif %}>Речі</a>
  <a href="/dreams"{% if path.startswith('/dreams') %} class="current"{% endif %}>Мрії</a>
  {% if chat_enabled %}<a href="/chat"{% if path.startswith('/chat') %} class="current"{% endif %}>Чат</a>{% endif %}
  <details class="admin">
    <summary>Адмін</summary>
    <div>
      <a href="/facts">Факти</a>
      <a href="/family">Користувачі</a>
      <a href="/messages">Повідомлення</a>
    </div>
  </details>
  <form method="get" action="/"><input type="search" name="q" value="{{ q or '' }}" placeholder="пошук"></form>
</nav>
{% block body %}{% endblock %}
<dialog class="lightbox"><img alt=""></dialog>
<script>
  // A photo opens over the page; Esc, a tap or a click closes it. Modified clicks keep the link.
  (function () {
    var box = document.querySelector('dialog.lightbox'), img = box.querySelector('img');
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-image]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      img.src = a.href;
      box.showModal();
    });
    box.addEventListener('click', function () { box.close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && box.open) box.close(); });
    box.addEventListener('close', function () { img.removeAttribute('src'); });
  })();
</script>
</body>
</html>
